
name: Build IntruderGuard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip -o IntruderGuard-source.zip
          test -f IntruderGuard/settings.gradle.kts
          test -f IntruderGuard/app/build.gradle.kts

      - name: Build APK
        run: gradle -p IntruderGuard assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IntruderGuard-debug
          path: IntruderGuard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
